<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>아이무브 관리페이지 실시간 편집기 - 수정판</title>
<style>
  :root{--bg:#eef3f1;--panel:#fff;--ink:#172321;--muted:#60706b;--line:#d9e4df;--main:#276757;--deep:#17463c;--danger:#9a3d24;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}
  header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--deep);color:#fff}
  header h1{font-size:16px;margin:0;font-weight:900} header .sub{font-size:12px;opacity:.82}
  .app{height:calc(100vh - 56px);display:grid;grid-template-columns:minmax(380px,45%) 1fr}
  .left{display:grid;grid-template-rows:auto auto 1fr;background:var(--panel);border-right:1px solid var(--line);min-width:0}
  .tabs,.buttons{display:flex;gap:8px;flex-wrap:wrap}
  .tabs{padding:10px 12px;border-bottom:1px solid var(--line);background:#f8fbfa}
  button{border:0;border-radius:10px;padding:9px 12px;font-weight:900;cursor:pointer;background:var(--main);color:#fff;font-size:12px}
  button.secondary{background:#edf4f1;color:var(--deep);border:1px solid var(--line)}
  button.warn{background:#fff0e8;color:var(--danger);border:1px solid #f2cbbd}
  .tab.active{background:var(--main);color:#fff}
  .tab{background:#fff;color:var(--deep);border:1px solid var(--line);border-radius:999px}
  .command{padding:12px;border-bottom:1px solid var(--line);background:#fbfdfc}
  .command label{display:block;font-size:12px;font-weight:900;color:var(--deep);margin-bottom:6px}
  .command textarea{width:100%;height:74px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:10px;font:13px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif;outline:none}
  .buttons{margin-top:8px}
  .help{font-size:12px;color:var(--muted);line-height:1.55;margin-top:8px}
  .editor-wrap{position:relative;min-height:0}
  #code{width:100%;height:100%;border:0;outline:none;resize:none;padding:16px 16px 80px;background:#101816;color:#eaf4ef;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2;white-space:pre;overflow:auto}
  #dataPanel{display:none;height:100%;padding:14px;overflow:auto;background:#fff}
  .data-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .data-grid label{display:grid;gap:4px;font-size:12px;font-weight:900;color:var(--muted)}
  .data-grid input,.data-grid textarea{border:1px solid var(--line);border-radius:10px;padding:9px;font:14px system-ui,-apple-system,"Noto Sans KR",sans-serif}
  .data-grid textarea,.full{grid-column:1/-1}
  .data-grid textarea{min-height:90px;resize:vertical}
  .right{display:grid;grid-template-rows:auto 1fr;min-width:0;background:#dfe8e4}
  .previewbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#f8fbfa;border-bottom:1px solid var(--line)}
  .previewbar span{font-size:12px;color:var(--muted);font-weight:800}
  iframe{width:100%;height:100%;border:0;background:#fff}
  .status{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.96);color:var(--deep);border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;box-shadow:0 4px 16px rgba(0,0,0,.12)}
  @media(max-width:900px){body{overflow:auto;height:auto}.app{height:auto;grid-template-columns:1fr}.left{height:65vh;border-right:0;border-bottom:1px solid var(--line)}.right{height:80vh}}
</style>
</head>
<body>
<header>
  <div><h1>아이무브 관리페이지 실시간 편집기</h1><div class="sub">왼쪽 HTML을 수정하면 오른쪽 미리보기가 바로 바뀝니다.</div></div>
  <div class="sub">수정판 · 미리보기 깨짐 해결</div>
</header>
<div class="app">
  <section class="left">
    <div class="tabs">
      <button class="tab active" id="tabCode" onclick="showTab('code')">HTML 코드</button>
      <button class="tab" id="tabData" onclick="showTab('data')">쉬운 정보 수정</button>
      <button class="tab" onclick="findDataBlock()">CLIENT_DATA 찾기</button>
    </div>
    <div class="command">
      <label for="commandBox">GPT에게 줄 수정 명령</label>
      <textarea id="commandBox" placeholder="예: 홍길동을 김○○으로 바꾸고, GMFCS를 4단계로 수정해줘. 보호자 메시지는 더 부드럽게 바꿔줘."></textarea>
      <div class="buttons">
        <button onclick="copyGptPrompt()">GPT 수정 프롬프트 복사</button>
        <button class="secondary" onclick="renderPreview(true)">미리보기 새로고침</button>
        <button class="secondary" onclick="downloadHtml()">현재 HTML 다운로드</button>
        <button class="secondary" onclick="fixEscapedCode()">깨진 문자 자동복구</button>
        <button class="warn" onclick="resetCode()">처음 상태 복구</button>
      </div>
      <div class="help">오른쪽에 &lt;!DOCTYPE html&gt; 같은 글자만 보이면 <b>깨진 문자 자동복구</b> 또는 <b>처음 상태 복구</b>를 누르세요. 이 수정판은 이전 저장값과 분리되어 바로 정상 표시됩니다.</div>
    </div>
    <div class="editor-wrap">
      <textarea id="code" spellcheck="false"></textarea>
      <div id="dataPanel">
        <div class="data-grid">
          <label>이름/코드<input id="fName"></label>
          <label>나이<input id="fAge" type="number"></label>
          <label>성별<input id="fGender"></label>
          <label>GMFCS<input id="fGmfcs" type="number" min="1" max="5"></label>
          <label>MAS<input id="fMas"></label>
          <label>우세/침범측<input id="fSide"></label>
          <label>고관절 MP %<input id="fHip" type="number"></label>
          <label>Cobb 각도<input id="fCobb" type="number"></label>
          <label>X-ray 날짜<input id="fXrayDate"></label>
          <label>업데이트 날짜<input id="fUpdated"></label>
          <label class="full">X-ray 요약<textarea id="fXraySummary"></textarea></label>
          <label class="full">보호자 메시지<textarea id="fMessage"></textarea></label>
        </div>
        <div class="buttons" style="margin-top:12px"><button onclick="applySimpleFields()">쉬운 정보 수정 반영</button><button class="secondary" onclick="loadSimpleFields()">현재 HTML에서 다시 불러오기</button></div>
      </div>
      <div class="status" id="status">준비됨</div>
    </div>
  </section>
  <section class="right">
    <div class="previewbar"><span>실시간 미리보기</span><div class="buttons"><button class="secondary" onclick="openPreviewNewWindow()">새 창으로 보기</button><button class="secondary" onclick="printPreview()">PDF/인쇄</button></div></div>
    <iframe id="preview" sandbox="allow-scripts allow-modals allow-forms"></iframe>
  </section>
</div>
<script>
const DEFAULT_HTML = "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <meta name=\"robots\" content=\"noindex, nofollow, noarchive\" />\n  <title>\uc544\uc774\ubb34\ube0c \uac1c\ubcc4 \uc6b4\ub3d9\ubc1c\ub2ec \uad00\ub9ac \ud398\uc774\uc9c0</title>\n  <style>\n    :root{\n      --bg:#f4f7f5; --paper:#fff; --ink:#172321; --muted:#5d6b67; --line:#dfe8e3;\n      --main:#276757; --main-deep:#17463c; --blue:#426f96; --amber:#b87235;\n      --good-bg:#eaf5ef; --good:#246348; --warn-bg:#fff4df; --warn:#86520a; --danger-bg:#fdece7; --danger:#9a3d24;\n      --shadow:0 8px 22px rgba(28,55,48,.06); --r:18px;\n    }\n    *{box-sizing:border-box} html{scroll-behavior:smooth}\n    body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,\"Noto Sans KR\",Arial,sans-serif;line-height:1.65;word-break:keep-all;padding-bottom:60px}\n    a{color:inherit}.container{max-width:900px;margin:0 auto;padding:0 18px}.hero{background:linear-gradient(135deg,var(--main-deep),var(--main));color:#fff;padding:38px 0 54px;border-radius:0 0 30px 30px;box-shadow:var(--shadow)}\n    .eyebrow{font-size:13px;letter-spacing:.08em;font-weight:700;opacity:.82}.hero h1{font-size:30px;line-height:1.25;margin:10px 0 10px}.subtitle{max-width:760px;margin:0;opacity:.86;font-size:15px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.chip{border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}.top-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.btn{border:none;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;background:#fff;color:var(--main-deep);text-decoration:none;display:inline-flex;align-items:center;gap:6px}.btn.secondary{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3)}\n    .notice{margin-top:-28px}.notice .box{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}.box b{color:var(--main-deep)}\n    .nav{position:sticky;top:0;z-index:5;background:rgba(244,247,245,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 0}.nav-scroll{display:flex;gap:8px;overflow:auto}.nav a{white-space:nowrap;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:800;color:var(--main-deep)}\n    main{padding-top:20px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;margin:18px 0}.card h2{font-size:18px;margin:0 0 16px;display:flex;align-items:center;gap:10px;color:var(--main-deep)}.num{width:26px;height:26px;border-radius:8px;background:var(--main);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}@media(max-width:720px){.grid,.grid3{grid-template-columns:1fr}.hero h1{font-size:25px}.card{padding:18px}}\n    .field{border:1px solid var(--line);background:#fbfdfb;border-radius:14px;padding:13px 14px}.label{font-size:12px;color:var(--muted);margin-bottom:4px}.value{font-size:16px;font-weight:850}.small{font-size:13px;color:var(--muted)}.pill{display:inline-flex;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800}.good{background:var(--good-bg);color:var(--good)}.warn{background:var(--warn-bg);color:var(--warn)}.danger{background:var(--danger-bg);color:var(--danger)}\n    .alert{border-radius:14px;padding:13px 14px;margin-top:12px;font-size:14px}.alert.good{background:var(--good-bg);color:var(--good)}.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.danger{background:var(--danger-bg);color:var(--danger)}\n    .timeline{display:grid;gap:12px}.visit{border-left:4px solid var(--main);background:#fbfdfb;border-radius:0 14px 14px 0;padding:12px 14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.visit-date{font-size:13px;font-weight:900;color:var(--main-deep)}\n    .goal{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.goal:last-child{border-bottom:none}.icon{width:36px;height:36px;border-radius:11px;background:var(--main);color:white;display:flex;align-items:center;justify-content:center;font-weight:900}.goal b{display:block;margin-bottom:2px}.goal span{font-size:14px;color:var(--muted)}\n    .home-list{display:grid;gap:10px}.home{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:#fbfdfb}.home-title{font-weight:900}.home-meta{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0}.home-meta span{font-size:12px;border-radius:999px;background:#eef5f1;color:var(--main-deep);padding:3px 8px;font-weight:800}.footer{margin:26px auto 0;text-align:center;color:var(--muted);font-size:12px;max-width:780px}.footer strong{color:var(--main-deep)}\n    .edit-guide{background:#f8fbfa}.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#eef4f1;border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;font-size:12px;white-space:pre-wrap}.hide-print{}@media print{.nav,.top-actions,.hide-print{display:none!important}.hero{border-radius:0;box-shadow:none}.notice{margin-top:12px}.card,.notice .box{box-shadow:none}body{background:#fff}.container{max-width:100%;padding:0 10px}}\n  </style>\n</head>\n<body>\n<script>\n/* ========================================================================\n  [GPT \uc218\uc815\uc6a9 \ub370\uc774\ud130 \uc601\uc5ed]\n  \ud658\uc790\ubcc4\ub85c \uc774 CLIENT_DATA \uc548\ucabd \ub0b4\uc6a9\ub9cc \uc218\uc815\ud558\uba74 \ub429\ub2c8\ub2e4.\n  \uc774\ub984 \ub300\uc2e0 \uc774\ub2c8\uc15c/\ucf54\ub4dc \ kg`)+field(\"\uc8fc\uc694 \uad00\ucc30\uc810\",c.mainConcern)+field(\"\uc88c\u00b7\uc6b0\uce21 \ud2b9\uc131\",b.dominantSide)+field(\"\ubcf4\uc870\uae30\",b.orthosis)+field(\"\uacbd\uc9c1 \uc815\ub3c4\",b.spasticity)+field(\"\uc218\uc220/\uc2dc\uc220 \uc774\ub825\",b.surgeryHistory);\n  document.getElementById(\"functionGrid\").innerHTML=field(\"GMFCS\",`${c.gmfcs}\ub2e8\uacc4<br><span class='small'>${GMFCS_DESC[c.gmfcs]||\"\"}</span>`)+field(\"MACS\",`${c.macs}\ub2e8\uacc4<br><span class='small'>${MACS_DESC[c.macs]||\"\"}</span>`)+field(\"CFCS\",`${c.cfcs}\ub2e8\uacc4<br><span class='small'>${CFCS_DESC[c.cfcs]||\"\"}</span>`);\n  document.getElementById(\"functionNote\").textContent = c.gmfcs>=3 ? \"GMFCS 3\ub2e8\uacc4 \uc774\uc0c1\uc5d0\uc11c\ub294 \ubcf4\ud589 \uae30\ub2a5 \ud5a5\uc0c1\ubfd0 \uc544\ub2c8\ub77c \uace0\uad00\uc808\u00b7\ucc99\ucd94 \ubcc0\ud615 \uc608\ubc29, \uc88c\uc11d/\ubcf4\uc870\uae30/\uc790\uc138 \uad00\ub9ac\uac00 \ud568\uaed8 \uc911\uc694\ud569\ub2c8\ub2e4.\" : \"\ud604\uc7ac \ub2e8\uacc4\uc5d0\uc11c\ub294 \uade0\ud615, \uc9c0\uad6c\ub825, \uc18d\ub3c4, \ucc38\uc5ec \ud65c\ub3d9\uc758 \uc9c8\uc744 \ub192\uc774\ub294 \ubc29\ud5a5\uc73c\ub85c \uc6b4\ub3d9 \ubaa9\ud45c\ub97c \uc138\uc6c1\ub2c8\ub2e4.\";\n  const mp=riskMP(s.hipMigrationPercent), cb=riskCobb(s.scoliosisAngle); document.getElementById(\"surveillanceGrid\").innerHTML=field(\"\uace0\uad00\uc808 MP\",`<span class='pill ${mp.cls}'>${mp.text}</span><br><span class='small'>\ucd2c\uc601\uc77c ${s.hipDate}</span>`)+field(\"\ucc99\ucd94 Cobb \uac01\ub3c4\",`<span class='pill ${cb.cls}'>${cb.text}</span><br><span class='small'>\ucd2c\uc601\uc77c ${s.scoliosisDate}</span>`)+field(\"\uc601\uc0c1\uac80\uc0ac \uc694\uc57d\",s.xraySummary)+field(\"\ub2e4\uc74c \uc758\ud559\uc801 \ud655\uc778\",s.nextMedicalCheck);\n  document.getElementById(\"surveillanceNotes\").innerHTML=`<div class=\"alert ${mp.cls}\">${mp.note}</div><div class=\"alert ${cb.cls}\">${cb.note}</div>`;\n  document.getElementById(\"goalList\").innerHTML=d.currentGoals.map((g,i)=>`<div class=\"goal\"><div class=\"icon\">${i+1}</div><div><b>${g.title}</b><span>${g.detail}</span></div></div>`).join(\"\");\n  document.getElementById(\"homeList\").innerHTML=d.homeProgram.map(h=>`<div class=\"home\"><div class=\"home-title\">${h.name}</div><div class=\"home-meta\"><span>${h.frequency}</span><span>${h.time}</span></div><div class=\"small\">\uc8fc\uc758: ${h.caution}</div></div>`).join(\"\");\n  document.getElementById(\"visitList\").innerHTML=d.visits.map(v=>`<div class=\"visit\"><div class=\"visit-date\">${v.date}</div><div>${v.summary}</div></div>`).join(\"\");\n  document.getElementById(\"parentMessage\").textContent=d.parentMessage; document.getElementById(\"footerName\").textContent=c.displayName; document.getElementById(\"footerContact\").textContent=`\ubb38\uc758: ${d.center.phone} \u00b7 ${d.center.email}`;\n}\nrender();\n<\/script>\n</body>\n</html>\n";
const codeEl = document.getElementById('code');

const statusEl = document.getElementById('status');
const STORAGE_KEY = 'imove_live_editor_html_fixed_v2';
let renderTimer;
function nowText(){ return new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', second:'2-digit'}); }
function setStatus(t){ statusEl.textContent = t; }
function looksEscaped(s){ return /^\s*&lt;!DOCTYPE|^\s*&lt;html|&lt;head&gt;/.test(s); }
function decodeEntities(s){ const ta=document.createElement('textarea'); ta.innerHTML=s; return ta.value; }
function init(){
  const saved = localStorage.getItem(STORAGE_KEY);
  codeEl.value = saved || DEFAULT_HTML;
  if(looksEscaped(codeEl.value)) codeEl.value = decodeEntities(codeEl.value);
  renderPreview(false); loadSimpleFields();
}
function renderPreview(save=true){
  let html = codeEl.value;
  if(looksEscaped(html)) html = decodeEntities(html);
  preview.srcdoc = html;
  if(save) localStorage.setItem(STORAGE_KEY, codeEl.value);
  setStatus('미리보기 반영 ' + nowText());
}
codeEl.addEventListener('input', () => { clearTimeout(renderTimer); renderTimer = setTimeout(() => renderPreview(true), 350); });
codeEl.addEventListener('keydown', e => {
  if(e.key==='Tab'){ e.preventDefault(); const s=codeEl.selectionStart, end=codeEl.selectionEnd; codeEl.value=codeEl.value.slice(0,s)+'  '+codeEl.value.slice(end); codeEl.selectionStart=codeEl.selectionEnd=s+2; }

function copyGptPrompt(){ const cmd=document.getElementById('commandBox').value.trim()||'아래 HTML을 보호자용 관리페이지로 더 보기 좋게 수정해줘.'; const prompt=`다음 HTML 파일을 수정해줘.

function extractClientDataText(){ const txt=codeEl.value; const start=txt.indexOf('const CLIENT_DATA ='); if(start<0)return null; const braceStart=txt.indexOf('{',start); if(braceStart<0)return null; let depth=0,inStr=false,quote='',esc=false; for(let i=braceStart;i<txt.length;i++){ const ch=txt[i]; if(inStr){ if(esc)esc=false; else if(ch==='\\')esc=true; else if(ch===quote)inStr=false; continue; } if(ch==='"'||ch==="'"||ch==='`'){ inStr=true; quote=ch; continue; } if(ch==='{')depth++; if(ch==='}'){ depth--; if(depth===0)return {start:braceStart,end:i+1,text:txt.slice(braceStart,i+1)}; } } return null; }
function parseData(){ const block=extractClientDataText(); if(!block)return null; try{ return Function('return ('+block.text+')')(); }catch(e){ console.warn(e); return null; } }
function loadSimpleFields(){ const d=parseData(); if(!d){ setStatus('CLIENT_DATA 해석 실패'); return; } const child=d.child||{}, clinical=d.clinical||d.surveillance||{}, body=d.body||{}; document.getElementById('fName').value=child.name||child.displayName||''; document.getElementById('fAge').value=child.age??''; document.getElementById('fGender').value=child.gender||''; document.getElementById('fGmfcs').value=child.gmfcs??''; document.getElementById('fMas').value=clinical.spasticity||body.spasticity||''; document.getElementById('fSide').value=clinical.dominantSide||body.dominantSide||''; document.getElementById('fHip').value=clinical.hipMigrationPercent??''; document.getElementById('fCobb').value=clinical.scoliosisAngle??''; document.getElementById('fXrayDate').value=clinical.xrayDate||clinical.hipDate||''; document.getElementById('fUpdated').value=child.lastUpdated||''; document.getElementById('fXraySummary').value=clinical.xraySummary||''; document.getElementById('fMessage').value=d.guardianMessage||d.parentMessage||''; }
function applySimpleFields(){ const block=extractClientDataText(); const d=parseData(); if(!block||!d){ setStatus('CLIENT_DATA 수정 실패'); return; } d.child=d.child||{}; d.clinical=d.clinical||d.surveillance||{}; d.body=d.body||{}; d.child.name=document.getElementById('fName').value; d.child.displayName=document.getElementById('fName').value; d.child.age=Number(document.getElementById('fAge').value||0); d.child.gender=document.getElementById('fGender').value; d.child.gmfcs=Number(document.getElementById('fGmfcs').value||0); d.clinical.spasticity=document.getElementById('fMas').value; d.body.spasticity=document.getElementById('fMas').value; d.clinical.dominantSide=document.getElementById('fSide').value; d.body.dominantSide=document.getElementById('fSide').value; const hip=document.getElementById('fHip').value; d.clinical.hipMigrationPercent=hip===''?null:Number(hip); const cobb=document.getElementById('fCobb').value; d.clinical.scoliosisAngle=cobb===''?null:Number(cobb); d.clinical.xrayDate=document.getElementById('fXrayDate').value; d.child.lastUpdated=document.getElementById('fUpdated').value; d.clinical.xraySummary=document.getElementById('fXraySummary').value; d.guardianMessage=document.getElementById('fMessage').value; d.parentMessage=document.getElementById('fMessage').value; const replacement=JSON.stringify(d,null,2).replace(/"([^"\n]+)":/g,'$1:'); codeEl.value=codeEl.value.slice(0,block.start)+replacement+codeEl.value.slice(block.end); renderPreview(true); setStatus('쉬운 정보 수정 반영 완료'); }
